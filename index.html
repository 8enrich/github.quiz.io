<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lupe de Lupe Quiz</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --accent: #00ff88;
            --text: #e0e0e0;
            --error: #ff4444;
        }

        body { 
            background-color: var(--bg); 
            color: var(--text); 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0;
            padding: 0;
            display: flex; 
            flex-direction: column; 
            height: 100vh;
            overflow: hidden;
        }

        header {
            padding: 15px;
            background: var(--card-bg);
            border-bottom: 2px solid var(--accent);
            text-align: center;
        }

        h2 { margin: 0; font-size: 1.2rem; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }

        #status-bar {
            font-size: 0.9rem;
            margin-top: 5px;
            font-weight: bold;
        }

        #output { 
            flex-grow: 1; 
            overflow-y: auto; 
            padding: 15px; 
            display: flex;
            flex-direction: column;
            gap: 15px;
            padding-bottom: 100px; /* Espaço para o teclado/input */
        }

        .album-card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid var(--accent);
        }

        .album-title {
            font-weight: bold;
            font-size: 0.9rem;
            margin-bottom: 8px;
            color: var(--accent);
            display: flex;
            justify-content: space-between;
        }

        .song-item {
            font-size: 0.85rem;
            padding: 4px 0;
            border-bottom: 1px solid #333;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        #input-container { 
            position: fixed;
            bottom: 0;
            width: 100%;
            background: #000;
            padding: 15px;
            box-sizing: border-box;
            display: flex; 
            gap: 10px;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.5);
        }

        input { 
            background: #222; 
            color: #fff; 
            border: 1px solid #444; 
            padding: 12px; 
            flex-grow: 1; 
            outline: none; 
            border-radius: 25px;
            font-size: 16px; /* Evita zoom automático no iOS */
        }

        input:focus { border-color: var(--accent); }

        button { 
            background: var(--accent); 
            color: #000; 
            border: none; 
            padding: 0 20px; 
            border-radius: 25px;
            cursor: pointer; 
            font-weight: bold; 
        }

        .btn-stop {
            background: #333;
            color: var(--error);
            font-size: 0.8rem;
        }

        .msg-pop {
            position: fixed;
            top: 70px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 5px 15px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.8rem;
            display: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <header>
        <h2>Lupe de Lupe Quiz</h2>
        <div id="status-bar">Músicas: 0/0</div>
    </header>

    <div id="msg-alert" class="msg-pop"></div>
    <div id="output"></div>
    
    <div id="input-container">
        <button class="btn-stop" onclick="desistir()">Sair</button>
        <input type="text" id="user-input" placeholder="Qual música?" autocomplete="off">
        <button onclick="processarChute()">></button>
    </div>

    <script>
        let over = false;
        let musicasOriginais = new Set();
        let albuns = {};
        let correct = new Set();

        const outputDiv = document.getElementById("output");
        const inputBox = document.getElementById("user-input");
        const statusBar = document.getElementById("status-bar");
        const msgAlert = document.getElementById("msg-alert");

        function removerAcentos(texto) {
            return texto.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
        }

        function showFlash(msg) {
            msgAlert.innerText = msg;
            msgAlert.style.display = "block";
            setTimeout(() => { msgAlert.style.display = "none"; }, 2000);
        }

        fetch('lupe.txt')
            .then(response => response.text())
            .then(data => {
                const linhas = data.split('\n');
                linhas.forEach(linha => {
                    if (linha.includes(',')) {
                        let parts = linha.split(',  ');
                        let nome = parts[0].trim();
                        let album = parts.slice(1).join(',  ').trim();
                        musicasOriginais.add(nome);
                        if (!albuns[album]) albuns[album] = [];
                        albuns[album].push(nome);
                    }
                });
                atualizarTela();
            })
            .catch(err => outputDiv.innerText = "Erro ao carregar lupe.txt");

        function atualizarTela() {
            statusBar.innerText = `Músicas: ${correct.size}/${musicasOriginais.size}`;
            outputDiv.innerHTML = "";

            for (let album in albuns) {
                let acertosNoAlbum = albuns[album].filter(m => correct.has(m));
                if (acertosNoAlbum.length > 0) {
                    let card = document.createElement('div');
                    card.className = 'album-card';
                    
                    let header = `<div class="album-title"><span>${album}</span> <span>${acertosNoAlbum.length}/${albuns[album].length}</span></div>`;
                    let lista = acertosNoAlbum.map(m => `<div class="song-item">✓ ${m}</div>`).join('');
                    
                    card.innerHTML = header + lista;
                    outputDiv.appendChild(card);
                }
            }
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function desistir() {
            if(over) return;
            let faltam = [...musicasOriginais].filter(m => !correct.has(m)).sort();
            over = true;
            outputDiv.innerHTML += `<div class="album-card" style="border-color: var(--error)">
                <div class="album-title" style="color: var(--error)">FIM DE JOGO - FALTARAM:</div>
                ${faltam.map(m => `<div class="song-item" style="color: #888">${m}</div>`).join('')}
            </div>`;
            outputDiv.scrollTop = outputDiv.scrollHeight;
        }

        function processarChute() {
            const guess = inputBox.value;
            if (!guess || over) return;
            inputBox.value = "";

            const guessClean = removerAcentos(guess);
            let encontrou = null;
            for (let m of musicasOriginais) {
                if (removerAcentos(m) === guessClean) {
                    encontrou = m;
                    break;
                }
            }

            if (encontrou) {
                if (!correct.has(encontrou)) {
                    correct.add(encontrou);
                    showFlash(`BOA! +1`);
                    atualizarTela();
                } else {
                    showFlash(`"${encontrou}" já foi!`);
                }
            } else {
                showFlash("Não encontrada");
            }
        }

        inputBox.addEventListener("keypress", (e) => {
            if (e.key === "Enter") processarChute();
        });
    </script>
</body>
</html>
